# Бренд-конфигурация booklet.
#
# Скопируй этот файл под именем brand.yaml в корень своего рабочего
# репозитория (или в папку конкретного проекта — тогда он перебьёт общий)
# и поправь под свой бренд. Указывать нужно только то, что отличается
# от дефолтов: остальное подставится само.
#
# Готовый рабочий пример — presets/univerus/brand.yaml.

# Название бренда. Идёт в <title> HTML, в alt логотипа и печатается
# вместо логотипа, если файл логотипа не задан.
name: "Моя школа"

# Домен без протокола. Печатается в нижнем колонтитуле каждой страницы
# и в подвале обложки. Оставь пустым, если домена нет.
site: "example.com"

# Слово после названия в верхнем колонтитуле: «Моя школа / гайд».
tagline: "гайд"

logo:
  # Путь к SVG-логотипу. Относительный считается сначала от папки этого
  # файла, потом от корня скилла. Пусто — печатать текстовое название.
  path: "assets/brand/logo-horizontal.svg"
  # Обрезка логотипа под обложку: подставляется в viewBox вместо родного.
  # Нужна, когда в SVG много пустых полей вокруг знака.
  # Оставь пустым, чтобы взять viewBox как есть в файле.
  viewbox: ""

# Палитра PDF. Значения идут в CSS-переменные генератора.
palette:
  primary: "#3785e2"   # фон обложки, заливка акцентных блоков
  blue: "#4ba7f9"      # светлый акцент, ссылки, маркеры
  gray: "#f5f9fc"      # фон страницы
  text: "#000000"      # основной текст
  white: "#ffffff"      # карточки и поверхности
  red: "#f4675d"       # предупреждения и запреты
  muted: "#5f6b7a"     # колонтитулы

cta:
  # H2, начинающийся с этой строки, выносится на отдельную финальную
  # CTA-страницу и получает особое оформление. Пусто — не выделять.
  platform_heading_prefix: "Платформа Моя школа"
  # H3, начинающийся с этой строки, оформляется как крупная ссылка-призыв.
  # Обычно это домен из site.
  link_heading_prefix: "example.com"

# Шрифты берутся из assets/fonts/ скилла. Здесь — имена подпапок.
# Чтобы поставить свои, положи файлы в assets/fonts/<имя> и укажи его тут.
fonts:
  heading_dir: "montserrat"
  sans_dir: "geist-sans"
  mono_dir: "geist-mono"
